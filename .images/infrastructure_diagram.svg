<svg width="680" height="390" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="10" y="10" width="660" height="370" rx="16" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="30" y="38" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">network-zabbix</text>
  <text x="30" y="54" font-family="sans-serif" font-size="12" fill="#B4B2A9">Docker bridge</text>

  <!-- PostgreSQL cluster -->
  <rect x="30" y="72" width="240" height="110" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="150" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#B5D4F4">PostgreSQL cluster</text>

  <!-- Primary -->
  <rect x="44" y="106" width="94" height="64" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="91" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#B5D4F4">Primary</text>
  <text x="91" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#85B7EB">:5432 [main]</text>
  <text x="91" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#85B7EB">R/W</text>

  <!-- Replica -->
  <rect x="162" y="106" width="94" height="64" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="209" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">Replica</text>
  <text x="209" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5DCAA5">:5433 [standby]</text>
  <text x="209" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5DCAA5">read-only</text>

  <!-- Primary <-> Replica -->
  <line x1="138" y1="138" x2="161" y2="138" stroke="#9c9a92" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Zabbix cluster -->
  <rect x="310" y="72" width="330" height="110" rx="10" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="475" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#FAC775">Zabbix servers</text>

  <!-- Server 1 -->
  <rect x="324" y="106" width="130" height="64" rx="8" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="389" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#FAC775">zabbix-server-1</text>
  <text x="389" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#EF9F27">:10051 [active]</text>

  <!-- Server 2 -->
  <rect x="486" y="106" width="140" height="64" rx="8" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="556" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#FAC775">zabbix-server-2</text>
  <text x="556" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#EF9F27">:10052 [standby]</text>

  <!-- DB → Zabbix -->
  <line x1="271" y1="138" x2="309" y2="138" stroke="#9c9a92" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Zabbix → Frontend -->
  <line x1="389" y1="170" x2="150" y2="276" stroke="#9c9a92" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Zabbix → Grafana -->
  <line x1="520" y1="170" x2="480" y2="276" stroke="#9c9a92" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <rect x="60" y="276" width="180" height="54" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="150" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#CECBF6">Frontend (Zabbix web)</text>
  <text x="150" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#AFA9EC">:8080</text>

  <!-- Grafana -->
  <rect x="390" y="276" width="180" height="54" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.5"/>
  <text x="480" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#F5C4B3">Grafana</text>
  <text x="480" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F0997B">:3000</text>

  <!-- Host access -->
  <line x1="150" y1="330" x2="150" y2="348" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="150" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C2C0B6">localhost:8080</text>

  <line x1="480" y1="330" x2="480" y2="348" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="480" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C2C0B6">localhost:3000</text>
</svg>
